# Applied with `set-colors` while the broadcast dock has the focus, and reset
# when it loses the focus or closes (see broadcast.py).
#
# Window colors only apply to the dock, except cursor and cursor_text_color,
# which also apply to the target windows.
#
# Tab bar colors apply to all OS windows of the same kitty process. Other
# settings such as tab_bar_margin_color are global and apply everywhere.

active_tab_background   #0076c9
tab_bar_margin_color    #0076c9
bell_border_color       #0076c9

cursor                  #0076c9
