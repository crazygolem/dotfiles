include theme.conf

tab_bar_style               custom
tab_separator               slanted
tab_title_template          "|{bell_symbol or activity_symbol}| |{title}"
active_tab_title_template   "|{' ' if layout_name == 'stack' else ''}{bell_symbol}| |{title}"
tab_bar_edge                top
tab_bar_min_tabs            1
tab_activity_symbol         ""
bell_on_tab                 "󱐋"
watcher                     clear_activity_on_tab_switch.py
watcher                     unfocused_settheme.py

font_size                   15.0
font_family                 family="Source Code Pro"
bold_font                   auto
italic_font                 auto
bold_italic_font            auto

window_padding_width        1
placement_strategy          top-left

# The GNOME extension Unite does not work with kitty to hide the titlebar only
# when maximized, so it has to be always hidden. This makes it impossible to
# just grab a window to move using the mouse (with 'titlebar-only', resizing
# works). But there are other easy ways:
# - Use alt+F7 or win+drag to move the window
# - Use alt+F8 to resize the window
hide_window_decorations     titlebar-only

remember_window_size        no
initial_window_width        80c
initial_window_height       24c

window_resize_step_cells    1
window_resize_step_lines    1

enabled_layouts             splits,stack

map alt+1                   goto_tab 1
map alt+2                   goto_tab 2
map alt+3                   goto_tab 3
map alt+4                   goto_tab 4
map alt+5                   goto_tab 5
map alt+6                   goto_tab 6
map alt+7                   goto_tab 7
map alt+8                   goto_tab 8
map alt+9                   goto_tab 9
map alt+0                   goto_tab 10

map ctrl+shift+t            new_tab_with_cwd
map ctrl+shift+n            new_os_window_with_cwd

map ctrl+shift+x            toggle_layout stack
map ctrl+shift+z            detach_window ask

# Mnemonics: direction relative to J; K to the right, M to the bottom
# The bias parameter set to the default value forces kitty to "forget" the last
# split's position when re-splitting from a single-window tab.
map ctrl+shift+k            launch --cwd=current --location=vsplit --bias=50
map ctrl+shift+m            launch --cwd=current --location=hsplit --bias=50

map ctrl+shift+up           kitten move_edge.py up
map ctrl+shift+left         kitten move_edge.py left
map ctrl+shift+right        kitten move_edge.py right
map ctrl+shift+down         kitten move_edge.py down
map ctrl+shift+.            layout_action equalize
map ctrl+shift+kp_decimal   layout_action equalize

map alt+up                  neighboring_window up
map alt+down                neighboring_window down
map alt+left                neighboring_window left
map alt+right               neighboring_window right

map ctrl+alt+up             move_window up
map ctrl+alt+left           move_window left
map ctrl+alt+right          move_window right
map ctrl+alt+down           move_window down

map ctrl+shift+plus         change_font_size all +0.5
map ctrl+shift+1            change_font_size all +0.5 # QWERTZ layout
map ctrl+shift+minus        change_font_size all -0.5
map ctrl+shift+0            change_font_size all 0
map ctrl+shift+kp_0         change_font_size all 0

map ctrl+shift+f4           remote_control_script broadcast
